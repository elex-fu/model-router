name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      RUN_OLLAMA_SMOKE: "0"
      RUN_KIMI_SMOKE: "0"
      RUN_DEEPSEEK_SMOKE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Build server and console
        run: npm run build
      - name: Run offline tests
        run: npm test
      - name: Run bounded business diagnostic harness tests
        run: |
          node --test scripts/performance/bounded-business-cluster.test.cjs
          python3 -m unittest discover -s scripts/performance -p 'bounded_business_*_test.py'
      - name: Run pinned Sub2api diagnostic runner unit tests
        run: python3 -m unittest discover -s scripts/performance -p 'sub2api_fresh_*_test.py'
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e

  managed-saas-postgres-integration:
    name: Managed SaaS PostgreSQL integration (PG ${{ matrix.postgres-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: node:22.16.0-bookworm
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: model_router_saas_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d model_router_saas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends postgresql-client openssl
          rm -rf /var/lib/apt/lists/*
      - name: Install locked dependencies
        run: npm ci
      - name: Check required managed SaaS gate wiring
        run: node --import tsx --test tests/ci/managed-saas-required-gates.test.ts
      - name: Strictly typecheck critical PostgreSQL test sources
        timeout-minutes: 3
        run: >-
          ./node_modules/.bin/tsc --noEmit
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          --lib ES2023 --strict --esModuleInterop --skipLibCheck --types node
          src/types/busboy.d.ts
          tests/saas/gateway/authorization-prelock-postgres.integration.test.ts
          tests/saas/gateway/managed-postgres-commercial-gateway.integration.test.ts
          tests/saas/gateway/candidate-live-reads.postgres.integration.test.ts
          tests/saas/gateway/reservation-planning.postgres.integration.test.ts
          tests/saas/gateway/admission-bench-fixture.ts
          tests/saas/gateway/runtime-health-clock-postgres-fixture.ts
          tests/saas/gateway/prepared-evidence-authority-postgres-fixture.ts
          tests/saas/billing/managed-postgres-financial-invariants.integration.test.ts
          tests/saas/supply/platform-inference-access.postgres.integration.test.ts
          tests/saas/gateway/responses-continuation.postgres.integration.test.ts
          tests/saas/payments/payment-merchant-binding.postgres.integration.test.ts
          tests/saas/metering/normal-success-postgres-fixture.ts
          tests/saas/db/migrations.test.ts
          tests/saas/db/migrations/054_trigger_only_trusted_execution.postgres.integration.test.ts
          tests/saas/db/migrations/055_prepared_evidence_optional_validity_scalars.postgres.integration.test.ts
          tests/saas/db/migrations/056_restricted_role_check_and_platform_auth_execution.test.ts
          tests/saas/db/migrations/056_restricted_role_check_and_platform_auth_execution.postgres.integration.test.ts
          tests/saas/platform/auth/managed-postgres-mfa-enrollment.integration.test.ts
          tests/saas/db/migrations/057_normal_success_usage_evidence_reference.test.ts
          tests/saas/db/migrations/058_credential_validation_invalidation_trigger_execution.test.ts
          tests/saas/db/migrations/058_credential_validation_invalidation_trigger_execution.postgres.integration.test.ts
          tests/cli/managed-saas-validation-worker-postgres.integration.test.ts
          tests/saas/supply/managed-postgres-credential-validation.integration.test.ts
          src/saas/db/credential-validation-worker-schema-readiness.ts
          src/saas/db/credential-validation-worker-privileges.ts
          src/saas/runtime/credential-validation-targets-module.ts
          tests/saas/db/credential-validation-worker-schema-readiness.test.ts
          tests/saas/db/credential-validation-worker-privileges.test.ts
          tests/ci/managed-saas-required-gates.test.ts
      - name: Apply managed SaaS role template, full migrations, and runtime privilege probe
        run: bash tests/saas/db/managed-postgres-runtime-privileges.integration.sh
      # Both roots need an empty queue. Run the source CLI before any business
      # fixture, then the worker business root before 058 leaves its own jobs.
      - name: Run required real PostgreSQL standard CLI empty-queue worker lifecycle gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_VALIDATION_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_VALIDATION_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_VALIDATION_E2E_WORKER_URL: postgresql://model_router_saas_validation_worker@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/cli/managed-saas-validation-worker-postgres.integration.test.ts
      - name: Run required real PostgreSQL dedicated credential-validation worker gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_VALIDATION_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_VALIDATION_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_VALIDATION_E2E_WORKER_URL: postgresql://model_router_saas_validation_worker@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/supply/managed-postgres-credential-validation.integration.test.ts
      # Worker prov-*/random-model and 058 random-product fixtures do not consume
      # bootstrap or share the HTTP gateway-e2e-* tenant/product namespace.
      # No worker process remains running when 058 creates its fixture jobs.
      - name: Run required real PostgreSQL 058 credential-validation invalidation gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/db/migrations/058_credential_validation_invalidation_trigger_execution.postgres.integration.test.ts
      # These optional live probes CREATE/DROP only random isolated schemas, so
      # they use the trust-enabled PostgreSQL service administrator. The
      # production migrator remains database/schema CREATE- and TEMP-restricted;
      # runtime privilege checks and gateway E2E below continue using app roles.
      - name: Run standalone migration 050 prepared evidence authorization advisory fence test
        env:
          MODEL_ROUTER_SAAS_MIGRATION_050_TEST_URL: postgresql://postgres@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/db/migrations/050_prepared_evidence_authorization_advisory_fences.test.ts
      - name: Run standalone migration 051 unknown-outcome support-ticket test
        env:
          MODEL_ROUTER_SAAS_MIGRATION_051_TEST_URL: postgresql://postgres@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/db/migrations/051_unknown_outcome_support_ticket.test.ts
      - name: Run required real PostgreSQL 054 trigger-only trusted execution gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/db/migrations/054_trigger_only_trusted_execution.postgres.integration.test.ts
      - name: Run required real PostgreSQL prelock and advisory concurrency gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/gateway/authorization-prelock-postgres.integration.test.ts
      - name: Run real PostgreSQL commercial gateway HTTP E2E
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/gateway/managed-postgres-commercial-gateway.integration.test.ts
      # Candidate probes own independent authority fixtures and verify the HTTP
      # lease history stays untouched. Keep this regression after the HTTP E2E.
      - name: Run required real PostgreSQL native candidate live-read batching gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/gateway/candidate-live-reads.postgres.integration.test.ts
      - name: Run required real PostgreSQL fenced reservation-planning gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/gateway/reservation-planning.postgres.integration.test.ts
      # 055 reuses only this fresh database's successful synthetic HTTP fixture;
      # configured roles with no successful BYOK/platform fixture fail closed.
      - name: Run required real PostgreSQL 055 prepared optional validity gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/db/migrations/055_prepared_evidence_optional_validity_scalars.postgres.integration.test.ts
      - name: Run required real PostgreSQL 056 restricted CHECK and platform-auth fencing gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/db/migrations/056_restricted_role_check_and_platform_auth_execution.postgres.integration.test.ts
      - name: Run required real PostgreSQL MFA enrollment and revocation gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/platform/auth/managed-postgres-mfa-enrollment.integration.test.ts
      - name: Run required real PostgreSQL financial invariants
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/billing/managed-postgres-financial-invariants.integration.test.ts

      # P0 roots own UUID namespaces; run after empty-queue worker gates and all
      # historical shared fixtures. No live upstream/PSP calls belong here.
      - name: Run required real PostgreSQL P0 platform inference access gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/supply/platform-inference-access.postgres.integration.test.ts

      - name: Run required real PostgreSQL encrypted Responses continuation history gate
        env:
          NODE_ENV: test
          MODEL_ROUTER_SAAS_GATEWAY_E2E_REQUIRED: "1"
          MODEL_ROUTER_SAAS_GATEWAY_E2E_MIGRATOR_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_CONTROL_PLANE_URL: postgresql://model_router_saas_control_plane@postgres:5432/model_router_saas_ci
          MODEL_ROUTER_SAAS_GATEWAY_E2E_GATEWAY_URL: postgresql://model_router_saas_gateway@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/gateway/responses-continuation.postgres.integration.test.ts
      # Test administrator only: each historical slice owns a random temporary
      # database. Production migrator never receives CREATEDB or this URL.
      - name: Run required real PostgreSQL isolated historical migration chains
        env:
          SAAS_TEST_DATABASE_URL: postgresql://model_router_saas_migrator@postgres:5432/model_router_saas_ci
          SAAS_TEST_DATABASE_ADMIN_URL: postgresql://postgres@postgres:5432/model_router_saas_ci
        run: node --import tsx --test tests/saas/db/migrations.test.ts

  # Each matrix item owns a NEW service/database; no database is shared between
  # roots or with the consumed HTTP fixture above. Existing root safety guards
  # allow service DNS postgres:5432 only for this exact CI database name.
  managed-saas-isolated-required-gates:
    name: Managed SaaS isolated required gate (${{ matrix.gate }}, PG ${{ matrix.postgres-version }})
    needs: managed-saas-postgres-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: node:22.16.0-bookworm
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["15", "18"]
        gate: ["cancellation-059", "pre-dispatch-compensation", "concurrent-claim", "normal-success-terminal-replay", "usage-correction-063", "key-ip-policy-080", "key-budget-policy-081", "key-budget-batched-mutations", "settlement-sigkill-crash", "member-directory", "member-directory-http", "dual-instance-failover", "marketing-redeem-codes-089", "marketing-promo-codes-090", "marketing-affiliate-091", "marketing-announcements-092", "quota-sync-093", "oauth-token-refresh-094", "announcement-fanout-095", "account-quarantine-097", "rate-limit-scheduling-098", "health-score-098", "oauth-refresh-onboarding", "kimi-commercial-preparation-diagnostic", "scheduler-native-protocol", "prepared-statements", "runtime-health-clock", "dispatch-capacity", "affinity-bind-race", "dispatch-proof-fence-batch", "payment-merchant-binding", "payment-worker-sigkill", "managed-saas-sigterm"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: model_router_saas_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d model_router_saas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends postgresql-client openssl
          rm -rf /var/lib/apt/lists/*
      - name: Install locked dependencies
        run: npm ci
      - name: Check required managed SaaS gate wiring
        run: node --import tsx --test tests/ci/managed-saas-required-gates.test.ts
      - name: Strictly typecheck isolated required roots and their fixtures
        timeout-minutes: 3
        run: >-
          ./node_modules/.bin/tsc --noEmit
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          --lib ES2023 --strict --esModuleInterop --skipLibCheck --types node
          src/types/busboy.d.ts
          tests/saas/db/migrations/059_pre_dispatch_terminal_cancellation.postgres.integration.test.ts
          tests/saas/gateway/pre-dispatch-compensation-postgres.integration.test.ts
          tests/saas/gateway/prepared-evidence-concurrent-claim.postgres.integration.test.ts
          tests/saas/metering/normal-success-terminal-replay.postgres.integration.test.ts
          tests/saas/metering/usage-correction.postgres.integration.test.ts
          tests/saas/keys/ip-policy.postgres.integration.test.ts
          tests/saas/keys/budget-policy.postgres.integration.test.ts
          tests/saas/keys/budget-batched-mutations.postgres.integration.test.ts
          tests/drills/settlement-sigkill-crash.postgres.integration.test.ts
          tests/saas/identity/tenant-member-directory.postgres.integration.test.ts
          tests/saas/identity/tenant-member-directory-http.postgres.integration.test.ts
          tests/drills/dual-instance-failover.postgres.integration.test.ts
          tests/saas/marketing/redeem-codes.postgres.integration.test.ts
          tests/saas/marketing/promo-codes.postgres.integration.test.ts
          tests/saas/marketing/affiliate.postgres.integration.test.ts
          tests/saas/marketing/announcements.postgres.integration.test.ts
          tests/saas/supply/quota-sync-worker.postgres.integration.test.ts
          tests/saas/supply/oauth-token-refresh.postgres.integration.test.ts
          tests/saas/webhooks/announcement-fanout.postgres.integration.test.ts
          tests/saas/supply/account-quarantine.postgres.integration.test.ts
          tests/saas/gateway/rate-limit-scheduling.postgres.integration.test.ts
          tests/saas/gateway/health-score.postgres.integration.test.ts
          tests/saas/supply/oauth-refresh-onboarding.postgres.integration.test.ts
          tests/integration/kimi-commercial-preparation-diagnostic.test.ts
          tests/saas/gateway/scheduler-native-protocol.postgres.integration.test.ts
          tests/saas/gateway/prepared-statements.postgres.integration.test.ts
          tests/saas/gateway/runtime-health-clock.postgres.integration.test.ts
          tests/saas/gateway/runtime-health-clock-postgres-fixture.ts
          tests/saas/gateway/dispatch-capacity.postgres.integration.test.ts
          tests/saas/gateway/affinity-bind-race.postgres.integration.test.ts
          tests/saas/supply/dispatch-proof-fence-batch.postgres.integration.test.ts
          scripts/ops/verify-commercial-kimi.ts
          tests/saas/gateway/pre-dispatch-postgres-fixture.ts
          tests/saas/metering/normal-success-postgres-fixture.ts
          tests/saas/gateway/managed-postgres-commercial-gateway.integration.test.ts
          tests/saas/payments/payment-merchant-binding.postgres.integration.test.ts
          tests/drills/payment-worker-sigkill.postgres.integration.test.ts
          tests/drills/helpers/payment-worker-sigkill-child.ts
          tests/saas/gateway/managed-saas-sigterm.postgres.integration.test.ts
          tests/ci/managed-saas-isolated-required-gates.ts
          tests/ci/managed-saas-required-gates.test.ts
      - name: Provision fresh CI service and execute the fixed required root
        run: node --import tsx tests/ci/managed-saas-isolated-required-gates.ts "${{ matrix.gate }}"

  # DOps plan §6 (docs/deployment-ops-efficiency-plan-2026-10-17.md): gate the
  # one-command deployment orchestration on every pull request, so a P15b-class
  # authorization gap (a runtime probe column missing from the role templates)
  # fails here instead of on a real deployment. Cold-start sequence, exactly as
  # the plan specifies: saas:deploy --dry-run (assert the step plan) → real
  # saas:deploy (bootstrap + explicit migration + role template replay + all
  # three runtime privilege probes) → saas:doctor per role, zero fails allowed.
  deploy-smoke:
    name: Managed SaaS deploy smoke (PG 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: node:22.16.0-bookworm
      options: --user root
    services:
      # Same disposable service shape as the PG gates above; the plan pins this
      # gate to postgres:16 (the gates above cover 15 and 18).
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: model_router_saas_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d model_router_saas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # The same disposable cache/coordination Redis the compose stack ships
      # (deploy/compose/docker-compose.yml): the control-plane doctor's Redis
      # RESP contract probe fail-closes without a reachable Redis.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install locked dependencies
        run: npm ci
      # Runtime-only deployment environment (repo rule: no secrets committed).
      # The helper generates the per-role URLs, the deployment administrator
      # URL (the CI service superuser), and the minimum KMS declarations
      # saas:doctor needs for a pass — including a randomly generated pilot
      # software-KMS master key that exists only in this RUNNER_TEMP file for
      # the lifetime of the job. Nothing in the repository ever holds a key.
      - name: Generate the runtime CI deployment environment file
        run: bash scripts/ci/generate-deploy-smoke-env.sh "$RUNNER_TEMP/deploy-smoke.env" postgres 5432 model_router_saas_ci redis://redis:6379
      # The CI service is trust-auth disposable, so every URL uses
      # sslmode=disable: the designated postgres:5432 CI endpoint that
      # saas:deploy accepts under --allow-local-plaintext (same rule as the
      # drill/track-F gates). Dry-run must exit 0 and print the full step plan
      # without touching the database.
      - name: saas:deploy dry-run asserts the step plan without touching the database
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx src/cli/index.ts saas:deploy \
            --env-file "$RUNNER_TEMP/deploy-smoke.env" \
            --allow-local-plaintext --dry-run \
            | tee "$RUNNER_TEMP/deploy-dry-run.log"
          grep -Fq "no database mutations will be performed" "$RUNNER_TEMP/deploy-dry-run.log"
          grep -Fq -- "- bootstrap: apply managed-saas-postgres-roles.sql" "$RUNNER_TEMP/deploy-dry-run.log"
          grep -Fq -- "- migrate: run the registered SaaS migrations as model_router_saas_migrator" "$RUNNER_TEMP/deploy-dry-run.log"
          grep -Fq -- "- roles: replay managed-saas-postgres-roles.sql and managed-saas-validation-worker-role-grants.sql" "$RUNNER_TEMP/deploy-dry-run.log"
          grep -Fq -- "- verify: migration registry check as the migrator" "$RUNNER_TEMP/deploy-dry-run.log"
          grep -Fq -- "- readiness: poll declared listener ports" "$RUNNER_TEMP/deploy-dry-run.log"
          grep -Fq "dry-run: preflight passed" "$RUNNER_TEMP/deploy-dry-run.log"
      # Real cold start against the empty service database, then the doctor
      # pass over every role. saas:doctor reads the process environment (it has
      # no --env-file option), so the generated file is sourced for the
      # diagnostic invocations only. Warns are allowed — the worker role cannot
      # read the migration ledger by design — but any fail fails the gate.
      # The plan's 15-minute budget is asserted explicitly on top of the
      # job-level timeout (locally the whole sequence runs in ~10s; the budget
      # exists for CI queue/slow-runner variance).
      - name: Real saas:deploy plus per-role saas:doctor under the 15-minute budget
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          node --import tsx src/cli/index.ts saas:deploy \
            --env-file "$RUNNER_TEMP/deploy-smoke.env" \
            --allow-local-plaintext \
            | tee "$RUNNER_TEMP/deploy.log"
          grep -Fq "registered migrations applied" "$RUNNER_TEMP/deploy.log"
          grep -Fq "model_router_saas_control_plane: runtime privilege probe green" "$RUNNER_TEMP/deploy.log"
          grep -Fq "model_router_saas_gateway: runtime privilege probe green" "$RUNNER_TEMP/deploy.log"
          grep -Fq "model_router_saas_validation_worker: runtime privilege probe green" "$RUNNER_TEMP/deploy.log"
          grep -Fq "next steps: start the workloads" "$RUNNER_TEMP/deploy.log"
          set -a
          . "$RUNNER_TEMP/deploy-smoke.env"
          set +a
          for role in control-plane gateway credential-validation-worker; do
            node --import tsx src/cli/index.ts saas:doctor --json --role "$role" \
              > "$RUNNER_TEMP/doctor-$role.json"
            node -e '
              const fs = require("node:fs");
              const role = process.argv[1];
              const result = JSON.parse(
                fs.readFileSync(`${process.env.RUNNER_TEMP}/doctor-${role}.json`, "utf8"),
              );
              if (result.format !== "saas-doctor-command-v1") {
                throw new Error(`doctor ${role}: unexpected format ${result.format}`);
              }
              if (result.role !== role) {
                throw new Error(`doctor ${role}: unexpected role ${result.role}`);
              }
              if (result.exitCode !== 0 || result.summary.fail !== 0) {
                throw new Error(
                  `doctor ${role}: ${JSON.stringify(result.summary)} — zero fails required (warns are allowed)`,
                );
              }
              console.log(`doctor ${role}: ${result.summary.pass} pass, ${result.summary.warn} warn, 0 fail`);
            ' "$role"
          done
          elapsed=$((SECONDS - start))
          echo "saas:deploy + saas:doctor wall time: ${elapsed}s (plan §6 budget: 900s)"
          test "$elapsed" -lt 900
